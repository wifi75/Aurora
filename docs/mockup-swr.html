<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>PO e SWR: tre proposte</title>
<style>
  body { margin: 0; padding: 18px; background: #e8ecf1; font: 13px "Segoe UI", system-ui, sans-serif; color: #1c2733; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  .opt { margin-bottom: 18px; }
  .opt h2 { font-size: 13px; margin: 0 0 6px; }
  .opt p { margin: 6px 0 0; color: #4a5866; font-size: 12px; }
  svg { display: block; background: #05080a; border-radius: 8px; }
  text { font-family: Consolas, "JetBrains Mono", monospace; }
</style>
</head>
<body>
<h1>PO e SWR nel display FT-2000: tre proposte (esempio in trasmissione: 65 W, SWR 1,4)</h1>
<div id="out"></div>
<script>
const CYAN = '#5ce8ff', AMBER = '#ffb428', RED = '#ff3b2f', DIM = '#1b3440', INK = '#d8f4ff', GREEN = '#47d13a';
const PO = 65, SWR = 1.4;
const out = document.getElementById('out');
function add(title, note, svg) {
  const d = document.createElement('div'); d.className = 'opt';
  d.innerHTML = `<h2>${title}</h2>${svg}<p>${note}</p>`; out.appendChild(d);
}
// barra a segmenti: n segmenti, quanti accesi, colore per indice
function seg(x, y, w, h, n, lit, color) {
  let s = ''; const g = 1.5, sw = (w - g * (n - 1)) / n;
  for (let i = 0; i < n; i++) s += `<rect x="${x + i * (sw + g)}" y="${y}" width="${sw}" height="${h}" rx="1" fill="${i < lit ? color(i) : DIM}"/>`;
  return s;
}
const poLit = Math.round(PO / 100 * 20);
const swrLit = Math.round(Math.min(1, (SWR - 1) / 2) * 20);
const swrColor = (i) => (i < 5 ? GREEN : i < 10 ? AMBER : RED);

// 1. due barre orizzontali sottili con numero a fianco
add('1 · Due barre a segmenti con il numero a destra',
  'Al posto della riga «PO 196 W SWR 1»: PO in azzurro, SWR verde/ambra/rossa (rossa oltre 2), numero subito a fianco. Occupa la stessa altezza di adesso.',
  `<svg width="300" height="60" viewBox="0 0 300 60">
    <text x="8" y="22" fill="${CYAN}" font-size="11" font-weight="700">PO</text>
    ${seg(36, 13, 190, 10, 20, poLit, () => CYAN)}
    <text x="234" y="22" fill="${CYAN}" font-size="12" font-weight="700">${PO} W</text>
    <text x="8" y="46" fill="${AMBER}" font-size="11" font-weight="700">SWR</text>
    ${seg(36, 37, 190, 10, 20, swrLit, swrColor)}
    <text x="234" y="46" fill="${AMBER}" font-size="12" font-weight="700">${SWR.toFixed(1)}</text>
  </svg>`);

// 2. barre con scala graduata, stile strumento Yaesu
{
  let ticks = '', lbl = '';
  for (let i = 0; i <= 10; i++) { const x = 36 + i * 19; ticks += `<rect x="${x}" y="${i % 5 ? 26 : 24}" width="1" height="${i % 5 ? 3 : 5}" fill="${INK}" opacity=".7"/>`; }
  ['0', '50', '100'].forEach((v, i) => { lbl += `<text x="${36 + i * 95}" y="20" fill="${INK}" font-size="8" text-anchor="middle" opacity=".8">${v}</text>`; });
  let lbl2 = '';
  ['1', '1.5', '2', '3', '∞'].forEach((v, i) => { lbl2 += `<text x="${36 + i * 47.5}" y="70" fill="${INK}" font-size="8" text-anchor="middle" opacity=".8">${v}</text>`; });
  add('2 · Barre con la scala graduata, come lo strumento della radio',
    'Ogni barra ha sopra o sotto i numeri della scala (0-50-100 W, 1-1.5-2-3-∞): si legge a colpo d’occhio come sul pannello della FT-2000. Un po’ più alta della 1.',
    `<svg width="300" height="78" viewBox="0 0 300 78">
      ${lbl}${ticks}
      <text x="8" y="40" fill="${CYAN}" font-size="11" font-weight="700">PO</text>
      ${seg(36, 31, 190, 9, 20, poLit, () => CYAN)}
      <text x="234" y="40" fill="${CYAN}" font-size="12" font-weight="700">${PO} W</text>
      <text x="8" y="57" fill="${AMBER}" font-size="11" font-weight="700">SWR</text>
      ${seg(36, 48, 190, 9, 20, swrLit, swrColor)}
      <text x="234" y="57" fill="${AMBER}" font-size="12" font-weight="700">${SWR.toFixed(1)}</text>
      ${lbl2}
    </svg>`);
}

// 3. barre continue luminose con il valore dentro un riquadro
add('3 · Barre continue luminose con il valore in un riquadro',
  'Barre piene con un leggero bagliore invece dei segmenti, valore in un riquadro a destra che diventa rosso se l’SWR supera la soglia di stop. Stile più moderno.',
  `<svg width="300" height="60" viewBox="0 0 300 60">
    <defs><filter id="g"><feGaussianBlur stdDeviation="1.6"/></filter></defs>
    <text x="8" y="22" fill="${CYAN}" font-size="11" font-weight="700">PO</text>
    <rect x="36" y="13" width="180" height="10" rx="5" fill="${DIM}"/>
    <rect x="36" y="13" width="${180 * PO / 100}" height="10" rx="5" fill="${CYAN}" filter="url(#g)" opacity=".7"/>
    <rect x="36" y="13" width="${180 * PO / 100}" height="10" rx="5" fill="${CYAN}"/>
    <rect x="224" y="9" width="64" height="18" rx="3" fill="none" stroke="${CYAN}"/>
    <text x="256" y="22" fill="${CYAN}" font-size="12" font-weight="700" text-anchor="middle">${PO} W</text>
    <text x="8" y="46" fill="${AMBER}" font-size="11" font-weight="700">SWR</text>
    <rect x="36" y="37" width="180" height="10" rx="5" fill="${DIM}"/>
    <rect x="36" y="37" width="${180 * Math.min(1, (SWR - 1) / 2)}" height="10" rx="5" fill="${GREEN}"/>
    <rect x="224" y="33" width="64" height="18" rx="3" fill="none" stroke="${GREEN}"/>
    <text x="256" y="46" fill="${GREEN}" font-size="12" font-weight="700" text-anchor="middle">${SWR.toFixed(1)}</text>
  </svg>`);
document.body.dataset.ready = '1';
</script>
</body>
</html>
