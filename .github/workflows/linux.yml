# Versione Linux di Aurora (non provata dall'autore, senza assistenza): a ogni push controlla che compili anche su Linux; a ogni release pubblicata
# prepara l'AppImage e il .deb e li allega alla release con nomi fissi (cosi' i link "latest/download" della pagina restano validi).
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# un push nuovo su main ferma il controllo del push precedente (la release no: ha il suo gruppo per tag)
concurrency:
  group: linux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  linux:
    # Ubuntu 22.04: l'AppImage compilata qui gira anche sulle distribuzioni meno recenti
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pacchetti di sistema
        # il mirror di Ubuntu sui runner a volte non risponde (DNS «Temporary failure resolving»): si riprova fino a 5 volte invece di restare
        # appesi per un'ora, e dopo 25 minuti il passo si ferma
        timeout-minutes: 25
        run: |
          for i in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y build-essential curl wget file pkg-config libssl-dev \
                libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
                libasound2-dev libudev-dev; then
              exit 0
            fi
            echo "pacchetti non scaricati (tentativo $i), riprovo tra 60 s"; sleep 60
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            desktop/src-tauri

      - name: Controllo del motore
        working-directory: core
        run: cargo check --workspace

      - name: File dei paesi (cty.dat)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p desktop/src-tauri/cty
          # il sito a volte rifiuta le macchine di GitHub: piu' tentativi distanziati, con un nome di programma normale
          for i in 1 2 3; do
            if curl -fsSL --connect-timeout 20 --max-time 90 -A "Mozilla/5.0 (Aurora build)" -o desktop/src-tauri/cty/cty.dat https://www.country-files.com/cty/cty.dat; then break; fi
            echo "cty.dat non scaricato (tentativo $i), riprovo tra 20 s"; sleep 20
          done
          # sito irraggiungibile: si usa la copia di riserva del repository (desktop/cty-riserva), invece di fermare la compilazione
          if [ ! -s desktop/src-tauri/cty/cty.dat ]; then echo "::warning::country-files.com non risponde: uso la copia di riserva di cty.dat"; cp desktop/cty-riserva/cty.dat desktop/src-tauri/cty/cty.dat; fi
          test "$(stat -c %s desktop/src-tauri/cty/cty.dat)" -gt 50000

      - name: Interfaccia
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Controllo del programma
        if: github.event_name != 'release'
        working-directory: desktop/src-tauri
        run: cargo check

      # gli strumenti dell'AppImage (AppRun, linuxdeploy) Tauri li scarica dalle release di GitHub: restano in cache, cosi' un guasto di
      # GitHub sugli scaricamenti (504 dell'8/11/2026) non ferma la compilazione
      - name: Cache degli strumenti dell'AppImage
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-appimage-tools-v1

      - name: Hamlib dentro l'AppImage e il .deb (rigctld, rigctl e librerie)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          # rigctld e rigctl ufficiali del pacchetto Ubuntu con le librerie che servono copiate accanto e il percorso riscritto ($ORIGIN/libs):
          # l'AppImage funziona senza installare Hamlib. Si lasciano al sistema le librerie di base (glibc) e libudev.
          sudo apt-get install -y libhamlib-utils patchelf
          B=desktop/src-tauri/hamlib-bundle
          mkdir -p "$B/libs"
          cp "$(command -v rigctld)" "$(command -v rigctl)" "$(command -v rotctld)" "$B/"
          for exe in rigctld rigctl rotctld; do
            ldd "$B/$exe" | awk '/=> \//{print $3}' | grep -Ev '/(libc|libm|libdl|libpthread|librt|libresolv|libutil|libgcc_s|ld-linux[^/]*|libudev)\.so' | while read -r lib; do cp -L "$lib" "$B/libs/"; done
            patchelf --set-rpath '$ORIGIN/libs' "$B/$exe"
          done
          for f in "$B"/libs/*.so*; do patchelf --set-rpath '$ORIGIN' "$f"; done
          "$B/rigctld" --version
          ls -la "$B" "$B/libs"

      - name: AppImage e .deb
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        working-directory: desktop
        env:
          AURORA_REQUIRE_HAMLIB: '1'
        run: |
          npm ci
          # se lo scaricamento degli strumenti non riesce si riprova (fino a 5 volte, un minuto fra un tentativo e l'altro)
          for i in 1 2 3 4 5; do
            if npx tauri build --bundles deb,appimage; then break; fi
            if [ "$i" = 5 ]; then exit 1; fi
            echo "compilazione non riuscita (tentativo $i), riprovo tra 60 s"; sleep 60
          done
          mkdir -p ../dist-linux
          cp src-tauri/target/release/bundle/appimage/*.AppImage ../dist-linux/Aurora-Linux-x86_64.AppImage
          cp src-tauri/target/release/bundle/deb/*.deb ../dist-linux/Aurora-Linux-amd64.deb
          cd ../dist-linux && sha256sum * > SHA256SUMS-linux.txt

      - name: Prova dell'AppImage (Hamlib dentro e che parta da solo)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          # si toglie l'Hamlib del sistema: rigctld deve partire con le sue librerie dentro l'AppImage, come sul PC di chi non lo installa
          sudo apt-get remove -y --purge libhamlib-utils 'libhamlib4*' || true
          cd "$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/dist-linux/Aurora-Linux-x86_64.AppImage" aurora.AppImage
          chmod +x aurora.AppImage
          ./aurora.AppImage --appimage-extract > /dev/null
          # Aurora lo cerca in <programma>/../lib/Aurora/hamlib
          R=squashfs-root/usr/lib/Aurora/hamlib/rigctld
          if [ ! -x "$R" ]; then
            echo "rigctld non e' in usr/lib/Aurora/hamlib: Aurora non lo troverebbe"; find squashfs-root -name 'rigctl*'; exit 1
          fi
          "$R" --version
          squashfs-root/usr/lib/Aurora/hamlib/rigctl -l | head -3

      - name: Allegati alla release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-linux/* --clobber

      - name: Pacchetti scaricabili (avvio a mano)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-linux
          path: dist-linux/
