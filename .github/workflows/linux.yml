# Versione Linux di Aurora (della comunita'): a ogni push controlla che compili anche su Linux; a ogni release pubblicata
# prepara l'AppImage e il .deb e li allega alla release con nomi fissi (cosi' i link "latest/download" della pagina restano validi).
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # Ubuntu 22.04: l'AppImage compilata qui gira anche sulle distribuzioni meno recenti
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pacchetti di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libasound2-dev libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            desktop/src-tauri

      - name: Controllo del motore
        working-directory: core
        run: cargo check --workspace

      - name: Interfaccia
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Controllo del programma
        if: github.event_name != 'release'
        working-directory: desktop/src-tauri
        run: cargo check

      - name: AppImage e .deb
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles deb,appimage
          mkdir -p ../dist-linux
          cp src-tauri/target/release/bundle/appimage/*.AppImage ../dist-linux/Aurora-Linux-x86_64.AppImage
          cp src-tauri/target/release/bundle/deb/*.deb ../dist-linux/Aurora-Linux-amd64.deb
          cd ../dist-linux && sha256sum * > SHA256SUMS-linux.txt

      - name: Allegati alla release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-linux/* --clobber

      - name: Pacchetti scaricabili (avvio a mano)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-linux
          path: dist-linux/
