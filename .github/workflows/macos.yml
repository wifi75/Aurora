# Versione macOS di Aurora (non provata dall'autore, senza assistenza): a ogni push controlla che il motore compili anche sul Mac; a ogni release
# pubblicata prepara il .dmg universale (Apple Silicon e Intel) e lo allega alla release con un nome fisso (link "latest/download" sempre validi).
# Il programma non e' firmato da Apple (solo firma ad hoc): al primo avvio macOS chiede conferma (tasto destro > Apri, oppure `xattr -cr`).
name: macOS

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            desktop/src-tauri

      - name: Controllo del motore
        working-directory: core
        run: cargo check --workspace

      - name: File dei paesi (cty.dat)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p desktop/src-tauri/cty
          # il sito a volte rifiuta le macchine di GitHub: piu' tentativi distanziati, con un nome di programma normale
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --retry 3 --retry-delay 5 -A "Mozilla/5.0 (Aurora build)" -o desktop/src-tauri/cty/cty.dat https://www.country-files.com/cty/cty.dat; then break; fi
            echo "cty.dat non scaricato (tentativo $i), riprovo tra 20 s"; sleep 20
          done
          test "$(stat -f %z desktop/src-tauri/cty/cty.dat)" -gt 50000

      - name: Interfaccia
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Programma (.dmg universale)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin --bundles app,dmg
          mkdir -p ../dist-macos
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ../dist-macos/Aurora-macOS.dmg
          cd ../dist-macos && shasum -a 256 * > SHA256SUMS-macos.txt

      - name: Allegati alla release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-macos/* --clobber

      - name: Pacchetto scaricabile (avvio a mano)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-macos
          path: dist-macos/
