# Versione macOS di Aurora (non provata dall'autore, senza assistenza): a ogni push controlla che il motore compili anche sul Mac; a ogni release
# pubblicata prepara il .dmg universale (Apple Silicon e Intel) e lo allega alla release con un nome fisso (link "latest/download" sempre validi).
# Accanto al .dmg allega il pacchetto di aggiornamento (Aurora.app compressa, Aurora-macOS.app.tar.gz) con la sua firma minisign (.sig),
# fatta con la stessa chiave degli aggiornamenti di Windows: Aurora lo scarica, ne controlla la firma e si sostituisce da sola.
# Il programma non e' firmato da Apple (solo firma ad hoc): al primo avvio macOS chiede conferma (tasto destro > Apri, oppure `xattr -cr`).
name: macOS

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release a cui allegare il .dmg (es. v0.11.195); vuoto = solo pacchetto scaricabile"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  macos:
    # macos-14 non e' piu' disponibile (2026-11-08): la macchina piu' recente di GitHub
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            desktop/src-tauri

      - name: Controllo del motore
        working-directory: core
        run: cargo check --workspace

      - name: File dei paesi (cty.dat)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p desktop/src-tauri/cty
          # il sito a volte rifiuta le macchine di GitHub: piu' tentativi distanziati, con un nome di programma normale
          for i in 1 2 3; do
            if curl -fsSL --connect-timeout 20 --max-time 90 -A "Mozilla/5.0 (Aurora build)" -o desktop/src-tauri/cty/cty.dat https://www.country-files.com/cty/cty.dat; then break; fi
            echo "cty.dat non scaricato (tentativo $i), riprovo tra 20 s"; sleep 20
          done
          # sito irraggiungibile: si usa la copia di riserva del repository (desktop/cty-riserva), invece di fermare la compilazione
          if [ ! -s desktop/src-tauri/cty/cty.dat ]; then echo "::warning::country-files.com non risponde: uso la copia di riserva di cty.dat"; cp desktop/cty-riserva/cty.dat desktop/src-tauri/cty/cty.dat; fi
          test "$(stat -f %z desktop/src-tauri/cty/cty.dat)" -gt 50000

      - name: Interfaccia
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Hamlib dentro l'app (rigctld e librerie da Homebrew)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          # rigctld ufficiale di Hamlib con le sue librerie copiate accanto e i percorsi riscritti (@executable_path/libs):
          # l'app funziona senza installare niente. La macchina di GitHub e' Apple Silicon: sui Mac Intel Aurora usa l'Hamlib di Homebrew
          brew install hamlib dylibbundler
          mkdir -p desktop/src-tauri/hamlib-bundle/libs
          cp "$(brew --prefix hamlib)/bin/rigctld" desktop/src-tauri/hamlib-bundle/
          chmod u+w desktop/src-tauri/hamlib-bundle/rigctld
          dylibbundler -of -b -x desktop/src-tauri/hamlib-bundle/rigctld -d desktop/src-tauri/hamlib-bundle/libs -p @executable_path/libs/
          codesign --force -s - desktop/src-tauri/hamlib-bundle/libs/*.dylib desktop/src-tauri/hamlib-bundle/rigctld
          desktop/src-tauri/hamlib-bundle/rigctld --version
          ls -la desktop/src-tauri/hamlib-bundle desktop/src-tauri/hamlib-bundle/libs

      - name: Programma (.dmg universale)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        working-directory: desktop
        env:
          AURORA_REQUIRE_HAMLIB: '1'
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin --bundles app,dmg
          mkdir -p ../dist-macos
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ../dist-macos/Aurora-macOS.dmg

      - name: Pacchetto di aggiornamento (Aurora.app compressa e firmata)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.AURORA_TIMBRO_AGGIORNAMENTI_AURORA_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.AURORA_PASSWORD_TIMBRO_AGGIORNAMENTI }}
        run: |
          # senza la chiave (copia del repository senza segreti) si allega solo il .dmg: Aurora sul Mac mostrera' il link alla release
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::chiave degli aggiornamenti assente: niente pacchetto di aggiornamento per macOS"
            exit 0
          fi
          app_dir=src-tauri/target/universal-apple-darwin/release/bundle/macos
          test -d "$app_dir/Aurora.app"
          # come gli «updater artifacts» di Tauri: la cartella Aurora.app compressa, senza i file ._ di macOS
          COPYFILE_DISABLE=1 tar -czf ../dist-macos/Aurora-macOS.app.tar.gz -C "$app_dir" Aurora.app
          # firma minisign accanto al pacchetto (Aurora-macOS.app.tar.gz.sig); la password e' vuota se il segreto non c'e'
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          npx tauri signer sign ../dist-macos/Aurora-macOS.app.tar.gz
          test -s ../dist-macos/Aurora-macOS.app.tar.gz.sig
          ls -la ../dist-macos

      - name: Impronte dei file
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        working-directory: dist-macos
        run: shasum -a 256 Aurora-macOS.dmg $(ls Aurora-macOS.app.tar.gz 2>/dev/null) > SHA256SUMS-macos.txt

      - name: Allegati alla release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist-macos/* --clobber

      - name: Pacchetto scaricabile (avvio a mano)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-macos
          path: dist-macos/
