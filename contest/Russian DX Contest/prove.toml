# Russian DX Contest - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento (https://www.rdxc.org/rules_eng, edizione 2027).
# Tre punti di vista: [prova] e' una stazione italiana (manda il numero progressivo), [[altra_stazione]] una stazione della Russia europea (manda la sigla della regione)
# e una della Russia asiatica. Nominativi di fantasia. Tutti i QSO sono del sabato 2027-03-20, dopo le 12:00 UTC (inizio dell'edizione 2027).
# Moltiplicatori: valore@modo (paesi e regioni contano una volta per banda, in qualunque modo; il controllo non mostra la banda).

