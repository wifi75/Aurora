# CQ WW DX SSB Contest - metadati e dichiarazioni (formato: docs/contest-formato.md)
# Regole lette il 2026-11-21 su https://www.cqww.com/rules/ («The 2026 CQ World-Wide DX Contest») e https://www.cqww.com/cabrillo.htm.

[contest]
id = "cq-ww-ssb"
nome = "CQ WW DX SSB Contest"
organizzatore = "CQ Magazine"
sito = "https://www.cqww.com"
regolamento_url = "https://www.cqww.com/rules/"
cabrillo_contest = "CQ-WW-SSB"
note = "Solo fonia (SSB), sei bande da 160 a 10 metri. Scambio: RS + zona CQ. Moltiplicatori: zone CQ e paesi DXCC/WAE per banda."

[edizione]
# Ultimo fine settimana pieno di ottobre, sabato 00:00 - domenica 23:59:59 UTC (48 ore). Il formato conta solo l'ennesimo
# fine settimana: 4 vale per il 2026; il 2027 ne ha cinque (30-31 ottobre), scritto sotto.
mese = 10
fine_settimana_pieno = 4
giorno_inizio = "sabato"
ora_inizio = "00:00"
durata_ore = 48
invio_log_giorni = 2              # entro 48 ore dalla fine (2026: 27 ottobre 23:59 UTC)

[[edizione.date]]
anno = 2026
inizio = "2026-10-24T00:00:00Z"
fine = "2026-10-25T23:59:59Z"
fonte = "https://www.cqww.com/rules/ (letto il 2026-11-21): «SSB: October 24-25, 2026»"
confermata = true

[[edizione.date]]
anno = 2027
inizio = "2027-10-30T00:00:00Z"
fine = "2027-10-31T23:59:59Z"
fonte = "calcolata: ultimo fine settimana pieno di ottobre"
confermata = false

[bande]
ammesse = ["160 m", "80 m", "40 m", "20 m", "15 m", "10 m"]

[modi]
ammessi = ["ssb"]

[[scambio.ricevuto]]
nome = "rst"
etichetta_it = "Rapporto"
etichetta_en = "Signal report"
tipo = "rst"
quando = "any"
predefinito = { ssb = "59" }

[[scambio.ricevuto]]
nome = "zona"
etichetta_it = "Zona CQ"
etichetta_en = "CQ zone"
tipo = "zona_cq"
quando = "any"
nota = "Proposta dal database dei paesi; vale quella mandata dal corrispondente (un W6 manda 03)."

[[scambio.inviato]]
nome = "rst"
etichetta_it = "Rapporto"
etichetta_en = "Signal report"
tipo = "rst"
quando = "any"
predefinito = { ssb = "59" }

[[scambio.inviato]]
nome = "zona"
etichetta_it = "Zona CQ"
etichetta_en = "CQ zone"
tipo = "zona_cq"
quando = "any"
nota = "La propria zona CQ (IO91wm = 14); si scrive in «La mia zona CQ» (Numero da mandare), senza incremento."

[doppi]
per = "banda"                     # una volta per banda; i doppi si tolgono senza penalita'

[categorie]
operatore = ["SO", "SOA", "MS", "M2", "MM", "MD"]   # Single Op (anche single band), Single Op Assisted, Multi-Single, Multi-Two, Multi-Multi, Multi-Distributed
potenza = ["QRP", "LOW", "HIGH"]  # 5 W, 100 W, 1500 W
sovrapposizioni = ["CLASSIC", "ROOKIE", "YOUTH"]
altre = ["Checklog"]

[categorie.ms]
potenza = ["LOW", "HIGH"]         # un segnale di run per 10 minuti + un segnale per i moltiplicatori su un'altra banda

[categorie.m2]
potenza = ["HIGH"]                # due segnali su bande diverse, 8 cambi di banda per ora

[categorie.mm]
potenza = ["HIGH"]

[cabrillo]
contest = "CQ-WW-SSB"
obbligatori = ["CALLSIGN", "CONTEST", "CATEGORY-OPERATOR", "CATEGORY-ASSISTED", "CATEGORY-BAND", "CATEGORY-POWER", "CATEGORY-MODE", "CLAIMED-SCORE", "CREATED-BY", "LOCATION"]
facoltativi = ["CATEGORY-TRANSMITTER", "CATEGORY-OVERLAY", "CATEGORY-STATION", "OPERATORS", "CLUB", "NAME", "ADDRESS", "EMAIL", "SOAPBOX"]
category_operator = ["SINGLE-OP", "MULTI-OP", "CHECKLOG"]
category_assisted = ["ASSISTED", "NON-ASSISTED"]
category_band = ["ALL", "160M", "80M", "40M", "20M", "15M", "10M"]
category_power = ["HIGH", "LOW", "QRP"]
category_mode = ["SSB"]
category_transmitter = ["ONE", "TWO", "UNLIMITED"]
category_overlay = ["CLASSIC", "ROOKIE", "YOUTH"]
invio = "solo caricamento web: https://www.cqww.com/logcheck/ (LOCATION: lo stato per gli USA, DX per gli altri)"

[[scheda]]
tipo = "moltiplicatori"
titolo = { it = "Zone CQ per banda", en = "CQ zones by band" }
ordine = 1
moltiplicatore = "zona_cq"
per_banda = true
per_modo = false

[[scheda]]
tipo = "moltiplicatori"
titolo = { it = "Paesi DXCC/WAE per banda", en = "DXCC/WAE countries by band" }
ordine = 2
moltiplicatore = "dxcc"
per_banda = true
per_modo = false

[[scheda]]
tipo = "statistiche"
titolo = { it = "Statistiche", en = "Statistics" }
ordine = 3
righe = ["banda"]
colonne = ["qso", "doppi", "punti", "moltiplicatori"]

[[scheda]]
tipo = "punteggio"
titolo = { it = "Punteggio", en = "Score" }
ordine = 4
mostra = ["punti", "moltiplicatori", "punteggio_finale"]
