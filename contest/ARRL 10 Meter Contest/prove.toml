# Totali attesi (conteggio a mano):
#   punti: 4+2+4+4+2+4+2+0+0+2+4 = 28
#   moltiplicatori CW: CT, ON, CMX, DL, AK = 5; SSB: CT, HI, JA, DL = 4; totale 9
#   punteggio = 28 x 9 = 252
[atteso]
qso_ammessi = 9
doppi = 1
non_ammessi = 1
punti = 28
moltiplicatori_cw = 5
moltiplicatori_ssb = 4
moltiplicatori = 9
punteggio = 252

# Caso che il motore attuale NON sa ancora riconoscere (non entra nei totali sopra): QSO CW oltre 28300 kHz.
# Il regolamento lo vuole non ammesso (6.2); oggi `bands=10` lo lascia ammesso. Resta qui come prova per il lavoro futuro.
