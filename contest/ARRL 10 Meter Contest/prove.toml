# ARRL 10 Meter Contest - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento.
# Stazione propria: IU3ABC (Italia = DX, manda il numero progressivo). Nominativi di fantasia.
# Il controllo automatico (docs/contest-formato.md) legge i QSO, applica punteggio.regole e confronta con [atteso].

[prova]
nominativo_proprio = "IU3ABC"
locatore_proprio = "IO91wm"
data = "2026-12-12"

# Colonne: banda (m), modo, freq_khz, ora_utc (hhmm), nominativo, rst_inviato, scambio_inviato, rst_ricevuto, scambio_ricevuto.
# atteso: ammesso (true/false), doppio, punti, moltiplicatori nuovi (valore@modo), motivo.

[[qso]]
n = 1
banda = 10
modo = "CW"
freq_khz = 28025
ora_utc = "0001"
nominativo = "K1ABC"
rst_inviato = "599"
scambio_inviato = "001"
rst_ricevuto = "599"
scambio_ricevuto = "CT"
atteso = { ammesso = true, doppio = false, punti = 4, moltiplicatori = ["CT@CW"], motivo = "CW 4 punti; stato CT nuovo in CW" }

