# Totali (a mano): ammessi 1-3, 5, 6, 8-10 = 8; doppi 1 (n. 4); non ammessi 1 (n. 7)
#   punti: 8 (1 per QSO)
#   moltiplicatori per banda: 20 m DL, K, K1, K2, I (5); 40 m K, K1 (2); 15 m JA, JA1 (2); 80 m I (1); 10 m VK, VK3 (2) = 12
#   continenti: EU NA AS OC = 4 (una volta sola); totale moltiplicatori 12 x 4 = 48
#   punteggio = 8 x 48 = 384
[atteso]
qso_ammessi = 8
doppi = 1
non_ammessi = 1
punti = 8
moltiplicatori = 48
punteggio = 384
