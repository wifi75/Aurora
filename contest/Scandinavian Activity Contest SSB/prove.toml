# Scandinavian Activity Contest SSB - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento 2026 (https://www.sactest.net/blog/scandinavian-activity-contest-2026-rules/).
# Tre punti di vista: [prova] e' una stazione italiana (europea, non scandinava), [[altra_stazione]] una stazione degli Stati Uniti (non europea) e una svedese (scandinava).
# Nominativi di fantasia. Tutti i QSO sono del sabato 2027-10-09, dopo le 12:00 UTC (inizio dell'edizione 2027).
# Moltiplicatori: valore@modo (contano una volta per banda; il controllo non mostra la banda).

