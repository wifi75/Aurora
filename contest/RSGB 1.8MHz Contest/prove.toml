# RSGB 1.8MHz Contest - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento RSGB 1.8MHz Contests 2026 (https://www.rsgbcc.org/hf/rules/2026/r160m.shtml).
# Due punti di vista: [prova] e' una stazione italiana (non UK&CD), [[altra_stazione]] una stazione inglese (UK&CD, manda anche il distretto).
# Nominativi di fantasia. Edizione 2027 (13 febbraio, provvisoria): tutti i QSO sono del sabato 2027-02-13 fra le 20:00 e le 23:00 UTC.
# Il bonus di 5 punti e' dato dal motore come «moltiplicatore» con add:5: i QSO attesi nominano il distretto o il paese che porta il bonus; non c'e' un totale di moltiplicatori.

[prova]
nominativo_proprio = "IU3ABC"
locatore_proprio = "IO91wm"
data = "2027-02-13"

[[qso]]
