banda = 160
modo = "CW"
freq_khz = 1830
ora_utc = "2001"
nominativo = "G3ABC"
rst_inviato = "599"
scambio_inviato = "001"
rst_ricevuto = "599"
scambio_ricevuto = "001 LS"
atteso = { ammesso = true, doppio = false, punti = 7, moltiplicatori = ["LS@CW"], motivo = "2 punti + 5 di bonus per il distretto LS nuovo" }

