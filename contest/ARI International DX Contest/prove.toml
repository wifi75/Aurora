# ARI International DX Contest - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento ufficiale 2026
# (https://www.ari.it/images/stories/ContestHF/ariinternationaldxcontest-dxrules2026.pdf).
# Due punti di vista: [prova] e' una stazione italiana (manda RST + provincia), [[altra_stazione]] una stazione tedesca (manda RST + numero progressivo).
# Nominativi di fantasia. Edizione 2027 (1-2 maggio, calcolata): tutti i QSO sono del sabato 2027-05-01, dopo le 12:00 UTC.
# Moltiplicatori: valore@modo (province e paesi contano una volta per banda; il controllo non mostra la banda).

