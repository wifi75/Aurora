# Totali (a mano): ammessi 1-4 e 6 = 5; doppi 1 (n. 5); non ammessi 1 (n. 7)
#   punti: 15+2+15+15+0+15 = 62
#   moltiplicatori: EU005 CW 20 m, EU005 SSB 20 m, EU010 CW 40 m, EU115 CW 15 m = 4
#   punteggio = 62 x 4 = 248
[atteso]
qso_ammessi = 5
doppi = 1
non_ammessi = 1
punti = 62
moltiplicatori = 4
moltiplicatori_cw = 3
moltiplicatori_ssb = 1
punteggio = 248

