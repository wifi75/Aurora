# RSGB IOTA Contest - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento 2026 (https://www.rsgbcc.org/hf/rules/2026/riota.shtml).
# Due punti di vista: [prova] e' una stazione World (IU3ABC), [[altra_stazione]] una stazione su un'isola (nominativo di fantasia, riferimento EU024 nello scambio inviato).
# Nominativi e riferimenti di fantasia. Tutti i QSO sono del sabato 2027-07-24, dopo le 12:00 UTC (inizio dell'edizione 2027, da confermare).
# Moltiplicatori: riferimento IOTA per banda e per modo (nell'elenco: «riferimento/modo@modo»).

[prova]
nominativo_proprio = "IU3ABC"
locatore_proprio = "IO91wm"
data = "2027-07-24"

[[qso]]
