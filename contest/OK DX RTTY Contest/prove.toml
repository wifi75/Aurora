# OK DX RTTY Contest - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento (http://okrtty.crk.cz/index.php?page=english, letto il 2026-11-24).
# Due punti di vista: [prova] e' una stazione italiana (non OK/OL: paesi + stazioni OK), [[altra_stazione]] una stazione OK (solo paesi).
# Nominativi di fantasia, edizione 2027 (sabato 18 dicembre). Moltiplicatori: valore@modo, una volta per banda.

