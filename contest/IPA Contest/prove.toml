# IPA Contest - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento IPARC (https://dl0ipa.darc.de/Contest.htm).
# Ogni modo si classifica a parte: [prova] e' il log CW di una stazione italiana, [[altra_stazione]] il log SSB della stessa stazione.
# Nominativi di fantasia. Tutti i QSO sono della domenica 2027-11-07 (l'edizione 2027 va da sabato 6 novembre alle 06:00 a domenica 7 alle 18:00 UTC, da confermare).
# Moltiplicatori: valore@modo (paesi DXCC e stati USA con una stazione IPARC, per banda; il controllo non mostra la banda).
# Punteggio = somma, banda per banda, dei punti x moltiplicatori della banda.

[prova]
nominativo_proprio = "IU3ABC"
locatore_proprio = "IO91wm"
data = "2027-11-07"

[[qso]]
