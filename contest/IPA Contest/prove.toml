# Totali (a mano): ammessi 1-4, 6-8 e 10 = 8; doppi 1 (n. 5); non ammessi 1 (n. 9)
#   punti: 80 m 5+5+5+1 = 16, 40 m 5+5+5 = 15, 20 m 5 = 5; in tutto 36
#   moltiplicatori: 80 m DL, CT, NY = 3; 40 m DL, CT = 2; 20 m ON = 1; in tutto 6
#   punteggio = 16 x 3 + 15 x 2 + 5 x 1 = 83
