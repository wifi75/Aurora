banda = 80
modo = "CW"
freq_khz = 3520
ora_utc = "0601"
nominativo = "DL1ABC"
rst_inviato = "599"
scambio_inviato = "001"
rst_ricevuto = "599"
scambio_ricevuto = "001 IPA"
atteso = { ammesso = true, doppio = false, punti = 5, moltiplicatori = ["DL@CW"], motivo = "stazione IPARC: 5 punti; paese DL con una stazione IPARC, nuovo su 80 m" }

