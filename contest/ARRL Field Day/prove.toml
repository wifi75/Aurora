# ARRL Field Day - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento 2026 (PDF https://www.arrl.org/files/file/Field-Day/2026/2026-Field-Day-Rules.pdf).
# Stazione italiana: manda la classe (qui 1D) e DX al posto della sezione. Nominativi di fantasia.
# Tutti i QSO sono della domenica 2027-06-27, prima delle 21:00 UTC (fine dell'edizione 2027: sabato 26 giugno 18:00 - domenica 27 giugno 20:59, da confermare).
# Il Field Day non ha moltiplicatori di paese: il punteggio mostrato e' la somma dei punti dei QSO (il moltiplicatore di potenza e i bonus restano fuori).

