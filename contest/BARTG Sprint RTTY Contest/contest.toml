# BARTG Sprint RTTY Contest (January Sprint) - metadati e dichiarazioni (formato: docs/contest-formato.md)
# Regole lette il 2026-11-24 su https://bartg.org.uk/wp-content/uploads/2025/05/bartg-sprint-rules-2025-v3.pdf (revisione del 21 maggio 2024,
# e' il regolamento piu' recente pubblicato) e sulla pagina https://bartg.org.uk/?p=137 (calendario 2027-2032).

[contest]
id = "bartg-sprint-rtty"
nome = "BARTG Sprint RTTY Contest"
alias = ["BARTG-Sprint RTTY"]     # nome del vecchio file: la cartella lo sostituisce
organizzatore = "BARTG (British Amateur Radio Teledata Group)"
sito = "https://bartg.org.uk"
regolamento_url = "https://bartg.org.uk/wp-content/uploads/2025/05/bartg-sprint-rules-2025-v3.pdf"
cabrillo_contest = "BARTG-SPRINT"
note = "Sprint di gennaio, solo RTTY, 80-10 metri, 24 ore. Si manda solo il numero progressivo (niente RST). 1 punto per QSO; moltiplicatori una volta sola: paesi DXCC e aree JA, W, VE, VK; continenti a parte."

[edizione]
# Quarto fine settimana pieno di gennaio, da sabato 12:00 UTC a domenica 11:59 UTC (24 ore).
mese = 1
fine_settimana_pieno = 4
giorno_inizio = "sabato"
ora_inizio = "12:00"
durata_ore = 24
invio_log_giorni = 7              # entro 7 giorni dalla fine

[[edizione.date]]
anno = 2027
inizio = "2027-01-23T12:00:00Z"
fine = "2027-01-24T11:59:59Z"
fonte = "https://bartg.org.uk/?p=137 (letto il 2026-11-24): 12:00z sabato 23 gennaio - 11:59z domenica 24 gennaio"
confermata = true

[bande]
ammesse = ["80 m", "40 m", "20 m", "15 m", "10 m"]

[modi]
ammessi = ["rtty"]                # solo RTTY (nel Cabrillo RY)

# Segmenti di frequenza (kHz) per banda, nel regolamento: fuori segmento zero punti e zero moltiplicatori; non controllati dal motore.
#   80 m 3580-3615, 40 m 7040-7125, 20 m 14070-14125 (14100 +/- 0,5 kHz zero), 15 m 21070-21148, 10 m 28070-28189.

[[scambio.ricevuto]]
nome = "numero"
etichetta_it = "Numero progressivo"
etichetta_en = "Message number"
tipo = "testo"
quando = "any"

[[scambio.inviato]]
nome = "numero"
etichetta_it = "Numero progressivo"
etichetta_en = "Message number"
tipo = "numero"
quando = "any"
progressivo = true
nota = "Tre o quattro cifre da 001, +1 a ogni QSO. Nello Sprint non si manda l'RST."

[doppi]
per = "banda"                     # una stazione una volta per banda per punti e moltiplicatori

[categorie]
operatore = ["SOE", "SOAB", "SOAB100", "SOABQRP", "MS", "MM"]
potenza = ["QRP", "100W", "MAX"]
altre = ["Checklog"]

[cabrillo]
# Il regolamento non scrive il valore di CONTEST: BARTG-SPRINT e' quello della specifica Cabrillo, da ricontrollare.
contest = "BARTG-SPRINT"
obbligatori = ["CALLSIGN", "CONTEST", "CATEGORY-OPERATOR", "CATEGORY-BAND", "CATEGORY-MODE", "CLAIMED-SCORE", "CREATED-BY", "EMAIL"]
facoltativi = ["CATEGORY-POWER", "CATEGORY-ASSISTED", "CATEGORY-TRANSMITTER", "OPERATORS", "CLUB", "NAME", "ADDRESS", "LOCATION", "SOAPBOX"]
category_operator = ["SINGLE-OP", "MULTI-OP", "CHECKLOG"]
category_band = ["ALL"]
category_power = ["HIGH", "LOW", "QRP"]
category_assisted = ["ASSISTED"]
category_transmitter = ["ONE", "UNLIMITED"]
invio = "entro 7 giorni al robot RSGB http://bartg.rsgbcc.org/cgi-bin/hfenter.pl (Cabrillo); riga QSO: freq. in kHz = frequenza MARK, RY, numero (senza RST)"

[[scheda]]
tipo = "moltiplicatori"
titolo = { it = "Paesi DXCC e aree JA, W, VE, VK", en = "DXCC countries and JA, W, VE, VK areas" }
ordine = 1
moltiplicatore = "dxcc"
per_banda = false
per_modo = false

[[scheda]]
tipo = "moltiplicatori"
titolo = { it = "Continenti", en = "Continents" }
ordine = 2
moltiplicatore = "continente"
per_banda = false
per_modo = false

[[scheda]]
tipo = "statistiche"
titolo = { it = "Statistiche", en = "Statistics" }
ordine = 3
righe = ["banda"]
colonne = ["qso", "doppi", "punti", "moltiplicatori"]

[[scheda]]
tipo = "punteggio"
titolo = { it = "Punteggio", en = "Score" }
ordine = 4
mostra = ["punti", "moltiplicatori", "punteggio_finale"]
