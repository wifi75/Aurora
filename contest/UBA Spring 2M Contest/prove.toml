# Totali (a mano): 5 QSO; non ammessi 2 (n. 3 fra due estere, n. 5 su 6 m); doppi 1 (n. 2); ammessi 1 e 4 = 2
#   punti 2 x 3 = 6; moltiplicatori ACC XXX = 2; punteggio = 6 x 2 = 12
[atteso]
qso_ammessi = 2
doppi = 1
non_ammessi = 2
punti = 6
moltiplicatori = 2
punteggio = 12

