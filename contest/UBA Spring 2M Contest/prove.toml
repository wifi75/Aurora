# UBA Spring 2M Contest - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento UBA Spring Contest 2026 (https://www.uba.be/en/hf/contest-rules/spring-contest-dst).
# Due punti di vista: [prova] e' una stazione italiana (estera: manda RST + numero, vale solo con ON), [[altra_stazione]] una stazione belga (manda RST + numero + sezione, vale con tutti).
# Nominativi di fantasia. Edizione 2027 (7 marzo, calcolata): tutti i QSO sono della domenica 2027-03-07, fra le 07:00 e le 11:00 UTC.
# Moltiplicatori: valore@modo (una volta sola: la banda e' una; il doppio vale anche passando da fonia a CW, da verificare).

[prova]
nominativo_proprio = "IU3ABC"
locatore_proprio = "IO91wm"
data = "2027-03-07"

[[qso]]
n = 1
banda = 2
modo = "SSB"
freq_khz = 144300
ora_utc = "0701"
nominativo = "ON4ABC"
rst_inviato = "59"
scambio_inviato = "001"
rst_ricevuto = "59"
scambio_ricevuto = "001 ACC"
atteso = { ammesso = true, doppio = false, punti = 3, moltiplicatori = ["ACC@SSB"], motivo = "belga: valido, 3 punti; sezione ACC nuova" }

[[qso]]
n = 2
banda = 2
modo = "CW"
freq_khz = 144050
ora_utc = "0705"
