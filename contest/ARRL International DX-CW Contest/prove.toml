# ARRL International DX-CW Contest - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento (ARRL International DX Contest Rules, v2.0).
# Il controllo automatico (docs/contest-formato.md) legge i QSO, applica punteggio.regole e punteggio.rhai e confronta con [atteso].
# Due punti di vista, perche' il punteggio dipende dalla stazione propria: [prova] e' una stazione W (Stati Uniti), [[altra_stazione]] una stazione DX (Italia).
# Nominativi di fantasia. Tutti i QSO sono del giorno 2027-02-20 (edizione 2027).
# Moltiplicatori: valore@modo (il moltiplicatore e' per banda, ma il controllo confronta solo valore e modo). Ogni QSO vale 3 punti; punteggio = punti x moltiplicatori (uno per banda).

