# HA-DX Contest - metadati e dichiarazioni (formato: docs/contest-formato.md)
# Regole lette il 2026-11-24 su https://ha-dx.com/en/contest-rules (pagina del regolamento, edizione 2026) e sull'esempio di Cabrillo di https://ha-dx.com/en/submit-log.

[contest]
id = "ha-dx"
nome = "HA-DX Contest"
alias = []                        # il vecchio file («HA-DX Contest», CW e SSB insieme) ha gia' lo stesso nome: la cartella lo sostituisce
organizzatore = "MRASZ (Magyar Radioamator Szovetseg, Hungarian Radio Amateur Society)"
sito = "https://ha-dx.com/"
regolamento_url = "https://ha-dx.com/en/contest-rules"
cabrillo_contest = "HA-DX"        # dall'esempio di intestazione Cabrillo di https://ha-dx.com/en/submit-log (il regolamento non lo scrive)
note = "CW e SSB nello stesso fine settimana di gennaio (24 ore), da 160 a 10 metri. Scambio: RS(T) + numero progressivo; le stazioni HA mandano RS(T) + sigla della contea. Punti: HA 10, stesso continente 2, altro continente 5. Moltiplicatori per banda (CW e SSB insieme): paesi DXCC e WAE (HA escluso) e le 20 contee ungheresi."

[edizione]
# Terzo fine settimana pieno di gennaio, sabato 12:00 - domenica 11:59 UTC (24 ore).
mese = 1
fine_settimana_pieno = 3
giorno_inizio = "sabato"
ora_inizio = "12:00"
durata_ore = 24
invio_log_giorni = 5              # il log Cabrillo va caricato entro 5 giorni dalla fine

[[edizione.date]]
anno = 2026
inizio = "2026-01-17T12:00:00Z"
fine = "2026-01-18T11:59:59Z"
fonte = "https://ha-dx.com/en/contest-rules: «2026: 17-18 January», sabato 12:00 UTC - domenica 12:00 UTC"
confermata = true

[[edizione.date]]
anno = 2027
inizio = "2027-01-16T12:00:00Z"
fine = "2027-01-17T11:59:59Z"
fonte = "calcolata dalla regola della pagina https://ha-dx.com/en/contest-rules (terzo fine settimana pieno di gennaio): il regolamento non scrive le date del 2027"
confermata = false

[bande]
ammesse = ["160 m", "80 m", "40 m", "20 m", "15 m", "10 m"]   # le bande WARC non sono nominate

[modi]
ammessi = ["cw", "ssb"]

[[scambio.ricevuto]]
nome = "rst"
etichetta_it = "Rapporto"
etichetta_en = "Signal report"
tipo = "rst"
quando = "any"
predefinito = { cw = "599", ssb = "59" }

[[scambio.ricevuto]]
nome = "numero"
etichetta_it = "Numero"
etichetta_en = "Serial number"
tipo = "testo"
quando = "not_dxcc:HA"
nota = "Le stazioni non ungheresi mandano un numero progressivo."

[[scambio.ricevuto]]
nome = "contea"
etichetta_it = "Contea (solo stazioni HA)"
etichetta_en = "County (HA stations only)"
tipo = "testo"
quando = "dxcc:HA"
elenco = "dati/contee.dom"

[[scambio.inviato]]
nome = "rst"
etichetta_it = "Rapporto"
etichetta_en = "Signal report"
tipo = "rst"
quando = "any"
predefinito = { cw = "599", ssb = "59" }

[[scambio.inviato]]
nome = "numero"
etichetta_it = "Numero"
etichetta_en = "Serial number"
tipo = "numero"
quando = "not_my_dxcc:HA"
progressivo = true

[[scambio.inviato]]
nome = "contea"
etichetta_it = "La mia contea (solo stazioni HA)"
etichetta_en = "My county (HA stations only)"
tipo = "testo"
quando = "my_dxcc:HA"
elenco = "dati/contee.dom"
nota = "Si scrive in «La mia sezione / stato / club» della scheda; le macro della stazione HA mandano <MYSECT>."

[doppi]
per = "banda+modo"                 # solo il primo QSO con una stazione su una banda; nelle categorie MIX si puo' fare un QSO in CW e uno in SSB con la stessa stazione sulla stessa banda

[categorie]
operatore = ["SOSB", "SO3BAND", "SOAB", "MS", "YOUTH12H"]   # SOSB: una banda; SO3BAND: tre bande a scelta; SOAB: tutte le bande; MS: multi-operatore MIX; YOUTH12H: fino a 25 anni, 12 ore
potenza = ["HP", "LP", "QRP"]                 # HP oltre 100 W, LP fino a 100 W, QRP fino a 5 W (solo MIX)
modo = ["CW", "SSB", "MIX"]
altre = ["12 ore (YOUTH12H)"]

[cabrillo]
contest = "HA-DX"
obbligatori = ["CALLSIGN", "CONTEST", "CATEGORY-OPERATOR", "CLAIMED-SCORE", "CREATED-BY"]
facoltativi = ["CATEGORY-ASSISTED", "CATEGORY-BAND", "CATEGORY-MODE", "CATEGORY-POWER", "OPERATORS", "CLUB", "NAME", "ADDRESS", "EMAIL", "LOCATION", "SOAPBOX"]
category_operator = ["SINGLE-OP", "MULTI-OP"]
category_assisted = ["ASSISTED", "NON-ASSISTED"]
category_mode = ["CW", "SSB", "MIXED"]
category_power = ["HIGH", "LOW", "QRP"]
invio = "caricamento su https://ha-dx.com/en/submit-log (o inserimento manuale) entro 5 giorni dalla fine; l'esempio del sito usa CATEGORY-BAND: SO3BAND; altri valori da verificare"

[[scheda]]
tipo = "moltiplicatori"
titolo = { it = "Paesi DXCC e WAE per banda", en = "DXCC and WAE countries by band" }
ordine = 1
moltiplicatore = "dxcc"
per_banda = true
per_modo = false
escludi = ["HA"]

[[scheda]]
tipo = "moltiplicatori"
titolo = { it = "Contee ungheresi per banda", en = "Hungarian counties by band" }
ordine = 2
moltiplicatore = "sezione"
per_banda = true
per_modo = false
dominio = "dati/contee.dom"

[[scheda]]
tipo = "statistiche"
titolo = { it = "Statistiche", en = "Statistics" }
ordine = 3
righe = ["banda"]
colonne = ["qso", "doppi", "punti", "scambio", "moltiplicatori_per_banda"]

[[scheda]]
tipo = "punteggio"
titolo = { it = "Punteggio", en = "Score" }
ordine = 4
mostra = ["punti", "moltiplicatori", "punteggio_finale"]
