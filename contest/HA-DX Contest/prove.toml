# HA-DX Contest - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento 2026 (https://ha-dx.com/en/contest-rules).
# Due punti di vista: [prova] e' una stazione italiana (europea, manda il progressivo), [[altra_stazione]] una stazione ungherese (manda la contea).
# Nominativi di fantasia. Tutti i QSO sono della domenica 2027-01-17, prima delle 12:00 UTC (fine dell'edizione 2027, da confermare).
# Moltiplicatori: valore@modo (paesi DXCC/WAE e contee, una volta per banda e per tutti i modi; il controllo non mostra la banda).

