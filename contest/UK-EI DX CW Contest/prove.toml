# UK-EI DX CW Contest - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento UKEICC versione 19 (https://www.ukeicc.com/dx-contest-rules.php).
# Tre punti di vista: [prova] e' una stazione italiana (europea non UK/EI), [[altra_stazione]] una stazione degli Stati Uniti (DX) e una inglese (UK/EI, con il doppio dei punti dalle 01:00 alle 04:59 UTC).
# Nominativi di fantasia. Tutti i QSO sono della domenica 2027-04-25, prima delle 12:00 UTC (fine dell'edizione 2027): il contest va dalle 12:00 del sabato alle 12:00 della domenica.
# Moltiplicatori: valore@modo (paesi DXCC non UK/EI e distretti UK/EI, una volta per banda; il controllo non mostra la banda).

