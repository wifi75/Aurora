# UBA Spring 80M CW Contest - QSO di esempio con il risultato atteso, calcolato a mano dal regolamento UBA Spring Contest 2026 (https://www.uba.be/en/hf/contest-rules/spring-contest-dst).
# Due punti di vista: [prova] e' una stazione italiana (estera: manda RST + numero, vale solo con ON), [[altra_stazione]] una stazione belga (manda RST + numero + sezione, vale con tutti).
# Nominativi di fantasia. Edizione 2027 (14 marzo, calcolata): tutti i QSO sono della domenica 2027-03-14, fra le 07:00 e le 11:00 UTC.
# Moltiplicatori: valore@modo (una volta sola: la banda e' una).

