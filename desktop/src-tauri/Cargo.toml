[package]
name = "aurora-desktop"
version = "0.11.234"
description = "Aurora per Windows: il programma con il core dentro, il vassoio, l'avvio automatico e gli aggiornamenti"
authors = ["Tiziano Cassone (IU3WJQ)"]
edition = "2024"
license = "GPL-3.0-only"
publish = false

# Un workspace a parte: Tauri ha dipendenze pesanti che non servono ai test del core.
[workspace]

[lib]
name = "aurora_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
aurora = { path = "../../core/crates/aurora" }
aurora-core = { path = "../../core/crates/aurora-core" }
remote-api = { path = "../../core/crates/remote-api" }
updater = { path = "../../core/crates/updater" }
online-info = { path = "../../core/crates/online-info" }
tokio = { version = "1", features = ["sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# l'agente nel tray chiede le versioni e i messaggi
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_System_ErrorReporting", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
# la finestra «Salva con nome» di Windows (pagina di esportazione del log)
rfd = { version = "0.17.2", default-features = false }

# su Linux la stessa finestra passa da GTK 3
[target.'cfg(not(windows))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }

[profile.release]
strip = true
