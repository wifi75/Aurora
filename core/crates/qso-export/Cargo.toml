[package]
name = "qso-export"
description = "Trasporto dei QSO registrati verso log esterni (ADIF su UDP o su file)"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
aurora-core = { path = "../aurora-core" }
logbook = { path = "../logbook" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "time"] }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
