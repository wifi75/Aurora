# Regole del contest «Personalizzato» per la pagina Contest di Aurora.
# Formato descritto in docs/piano-contest.md (sezione 4). Le regole cambiano ogni anno: controllare la fonte prima della gara.
# Un contest scelto dall'operatore: attivita', parola del CQ, scambio e orari si cambiano nella scheda «Impostazioni del contest».

[contest]
id = "personalizzato"
nome = "Personalizzato"
sponsor = ""
edizione = 2026
url_regole = ""
verificato_il = "2026-11-08"
famiglia = "attivita"

[sintesi]
it = "Contest scelto da te: attivita' dei messaggi, parola del CQ, scambio, bande e orari si impostano nella scheda «Impostazioni del contest». Di base: messaggi normali, 1 punto per QSO, moltiplicatori = locatori a 4 caratteri per banda, log Cabrillo."
en = "A contest of your choice: message activity, CQ word, exchange, bands and times are set in the «Contest settings» card. Default: normal messages, 1 point per QSO, multipliers = 4-character grids per band, Cabrillo log."

[calendario]
regola = "sempre"
inizio = "+0 00:00"
fine = "+0 23:59"

[bande]
ammesse = ["160m", "80m", "60m", "40m", "30m", "20m", "17m", "15m", "12m", "10m", "6m", "2m", "70cm"]

# frequenze di partenza in kHz (frequenza della radio, USB) per modo
[bande.frequenze]
"160m" = { FT8 = 1840.0, FT4 = 1840.0 }
"80m" = { FT8 = 3573.0, FT4 = 3575.5 }
"60m" = { FT8 = 5357.0 }
"40m" = { FT8 = 7074.0, FT4 = 7047.5 }
"30m" = { FT8 = 10136.0, FT4 = 10140.0 }
"20m" = { FT8 = 14074.0, FT4 = 14080.0 }
"17m" = { FT8 = 18100.0, FT4 = 18104.0 }
"15m" = { FT8 = 21074.0, FT4 = 21140.0 }
"12m" = { FT8 = 24915.0, FT4 = 24919.0 }
"10m" = { FT8 = 28074.0, FT4 = 28180.0 }
"6m" = { FT8 = 50313.0, FT4 = 50318.0 }
"2m" = { FT8 = 144174.0, FT4 = 144170.0 }
"70cm" = { FT8 = 432174.0 }

[modi]
ammessi = ["FT8", "FT4", "MSK144", "Q65"]
stesso_modo_per_doppi = true

[messaggi]
attivita = "standard"
parola_cq = ""
chiusura = "RR73"
settantatre_finale = "facoltativo"

[scambio]
inviato = ["snr", "grid4"]
ricevuto = ["snr", "grid4"]

[doppi]
chiave = "banda+modo"
log_doppi = "no"

[punti]
tipo = "fisso"
fisso = 1

[[moltiplicatori]]
tipo = "grid4"
ambito = "per-banda"

[punteggio]
formula = "punti*molt"

[[categorie]]
id = "SO"
nome = "Single Op"
operatore = "SINGLE-OP"
potenza = "LOW"
trasmettitori = "ONE"
bande = "ALL"
assistenza = "NON-ASSISTED"

[[categorie]]
id = "MO"
nome = "Multi Op"
operatore = "MULTI-OP"
potenza = "LOW"
trasmettitori = "ONE"
bande = "ALL"
assistenza = "ASSISTED"

[restrizioni]
avvio_umano = false
fox_hound = "vietato"
multi_flusso = "vietato"

[export]
formato = "cabrillo"
cabrillo_contest = ""
cabrillo_modo = "DG"
colonne_inviate = ["snr", "grid4"]
colonne_ricevute = ["snr", "grid4"]
frequenza = "khz"
invio_url = ""
scadenza = ""
