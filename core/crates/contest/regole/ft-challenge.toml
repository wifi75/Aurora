# Regole del contest «International FT Challenge» per la pagina Contest di Aurora.
# Formato descritto in docs/piano-contest.md (sezione 4). Le regole cambiano ogni anno: controllare la fonte prima della gara.
# Erede dell'FT Roundup (chiuso). Messaggi normali di tutti i giorni: chi non fa il contest da' punti lo stesso.

[contest]
id = "ft-challenge"
nome = "International FT Challenge"
sponsor = "RTTYcontesting"
edizione = 2026
url_regole = "https://www.rttycontesting.com/ft-challenge/rules/"
verificato_il = "2026-11-08"
famiglia = "hf"
# da verificare sul regolamento dell'anno
da_verificare = ["calendario"]

[sintesi]
it = "Primo fine settimana di dicembre, 18:00 sabato - 23:59 domenica UTC; contano solo le prime 24 ore, pause di almeno 30 minuti. FT4 o FT8 su 80-10 m, una volta per banda. Messaggi normali: locatore nel primo messaggio e rapporto. Punti: 1 + distanza/3000 km; senza locatore ZZ00 = 1 punto. Moltiplicatori: campi per banda. Fino a 100 W (oltre = checklog). Log Cabrillo su rttycontesting.com."
en = "First weekend of December, 1800 Sat - 2359 Sun UTC; only the first 24 hours count, off-times of at least 30 minutes. FT4 or FT8 on 80-10 m, once per band. Normal messages: grid in the first message and report. Points: 1 + distance/3000 km; no grid ZZ00 = 1 point. Multipliers: fields per band. Up to 100 W (above = checklog). Cabrillo log to rttycontesting.com."

[calendario]
regola = "primo-weekend:dicembre"
inizio = "sab 18:00"
fine = "dom 23:59"
ore_massime = 24.0
pausa_minima_min = 30

[calendario.date_fisse]
2026 = ["2026-12-05T18:00Z", "2026-12-06T23:59Z"]

[bande]
ammesse = ["80m", "40m", "20m", "15m", "10m"]

# frequenze di partenza in kHz (frequenza della radio, USB) per modo
[bande.frequenze]
"80m" = { FT8 = 3573.0, FT4 = 3575.5 }
"40m" = { FT8 = 7074.0, FT4 = 7047.5 }
"20m" = { FT8 = 14074.0, FT4 = 14083.0 }
"15m" = { FT8 = 21074.0, FT4 = 21140.0 }
"10m" = { FT8 = 28074.0, FT4 = 28180.0 }

[modi]
ammessi = ["FT8", "FT4"]
stesso_modo_per_doppi = true

[messaggi]
attivita = "standard"
parola_cq = ""
chiusura = "RR73"
settantatre_finale = "facoltativo"

[scambio]
inviato = ["grid4", "snr"]
ricevuto = ["grid4", "snr"]

[doppi]
chiave = "banda"
log_doppi = "no"

[punti]
tipo = "distanza"
base = 1
passo_km = 3000
arrotonda = "giu"

[[moltiplicatori]]
tipo = "campo2"
ambito = "per-banda"

[punteggio]
formula = "punti*molt"

[[categorie]]
id = "SO-LOW"
nome = "Single Op Low (100 W)"
operatore = "SINGLE-OP"
potenza = "LOW"
trasmettitori = "ONE"
bande = "ALL"
assistenza = "NON-ASSISTED"

[[categorie]]
id = "SO-QRP"
nome = "Single Op QRP (5 W)"
operatore = "SINGLE-OP"
potenza = "QRP"
trasmettitori = "ONE"
bande = "ALL"
assistenza = "NON-ASSISTED"

[[categorie]]
id = "MO-LOW"
nome = "Multi Op Low"
operatore = "MULTI-OP"
potenza = "LOW"
trasmettitori = "ONE"
bande = "ALL"
assistenza = "ASSISTED"

[restrizioni]
avvio_umano = false
fox_hound = "vietato"
multi_flusso = "vietato"

[export]
formato = "cabrillo"
cabrillo_contest = "FT-CHALLENGE"
cabrillo_modo = "DG"
colonne_inviate = ["snr", "grid4"]
colonne_ricevute = ["snr", "grid4"]
frequenza = "khz"
invio_url = "https://www.rttycontesting.com/"
scadenza = "7 giorni"
