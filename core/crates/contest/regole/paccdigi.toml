# Regole del contest «PACCdigi Contest» per la pagina Contest di Aurora.
# Formato descritto in docs/piano-contest.md (sezione 4). Le regole cambiano ogni anno: controllare la fonte prima della gara.
# Scambio: le stazioni olandesi mandano rapporto e sigla della provincia, le altre rapporto e numero progressivo.

[contest]
id = "paccdigi"
nome = "PACCdigi Contest"
sponsor = "VERON"
edizione = 2026
url_regole = "https://veron.nl/vereniging/commissies-en-werkgroepen/traffic-bureau/hf-contesten/paccdigi-rules/"
verificato_il = "2026-11-08"
famiglia = "hf"
# da verificare sul regolamento dell'anno
da_verificare = []

[sintesi]
it = "Aprile (2026: 18 aprile 12:00 - 19 aprile 11:59 UTC; singolo operatore al massimo 18 ore, pause di almeno 1 ora). RTTY e FT4/FT8 (FT4 e FT8 sono lo stesso modo per i doppi) su 160-10 m senza WARC. Si lavorano le stazioni olandesi: moltiplicatori = 12 province per banda e per modo (al massimo 24 per banda). Scambio: rapporto e numero progressivo (le olandesi rapporto e provincia). Punti: 1 con stazioni non olandesi, 3 con le olandesi. FT8 su 1,843-3,577-7,077-14,077-21,077-28,077 MHz, FT4 su 1,840-3,580-7,080-14,083-21,080-28,080, messaggi standard. Log Cabrillo al VERON entro una settimana."
en = "April (2026: 18 April 1200 - 19 April 1159 UTC; single operators 18 hours max, off-times of at least 1 hour). RTTY and FT4/FT8 (FT4 and FT8 are the same mode for dupes) on 160-10 m, no WARC. Work Dutch stations: multipliers = 12 provinces per band and mode (max 24 per band). Exchange: report and serial number (Dutch stations report and province). Points: 1 for non-Dutch, 3 for Dutch stations (counted here as 1). FT8 on 1.843-3.577-7.077-14.077-21.077-28.077 MHz, FT4 on 1.840-3.580-7.080-14.083-21.080-28.080, standard messages. Cabrillo log to VERON within a week."

[calendario]
regola = "terzo-sabato:aprile"
inizio = "sab 12:00"
fine = "dom 11:59"
# singolo operatore: 18 ore su 24, pause di almeno un'ora
ore_massime = 18.0
pausa_minima_min = 60

[calendario.date_fisse]
2026 = ["2026-04-18T12:00Z", "2026-04-19T11:59Z"]

[bande]
ammesse = ["160m", "80m", "40m", "20m", "15m", "10m"]

# frequenze di partenza in kHz (frequenza della radio, USB) per modo
[bande.frequenze]
# dal regolamento PACCdigi (par. 3.1)
"160m" = { FT8 = 1843.0, FT4 = 1840.0 }
"80m" = { FT8 = 3577.0, FT4 = 3580.0 }
"40m" = { FT8 = 7077.0, FT4 = 7080.0 }
"20m" = { FT8 = 14077.0, FT4 = 14083.0 }
"15m" = { FT8 = 21077.0, FT4 = 21080.0 }
"10m" = { FT8 = 28077.0, FT4 = 28080.0 }

[modi]
ammessi = ["FT8", "FT4"]
stesso_modo_per_doppi = true

[messaggi]
attivita = "standard"
parola_cq = ""
chiusura = "RR73"
settantatre_finale = "facoltativo"

[scambio]
inviato = ["rst", "seriale"]
ricevuto = ["rst", "provincia"]

[doppi]
chiave = "banda"
log_doppi = "no"

[punti]
# 1 punto con le non olandesi, 3 con le olandesi (paese DXCC con prefisso principale PA)
tipo = "per-paese"
fisso = 1
tabella = { PA = 3 }

[[moltiplicatori]]
tipo = "provincia-pa"
ambito = "per-banda"

[punteggio]
formula = "punti*molt"

[[categorie]]
id = "SO"
nome = "Single Op"
operatore = "SINGLE-OP"
potenza = "LOW"
trasmettitori = "ONE"
bande = "ALL"
assistenza = "NON-ASSISTED"

[[categorie]]
id = "MO"
nome = "Multi Op"
operatore = "MULTI-OP"
potenza = "HIGH"
trasmettitori = "ONE"
bande = "ALL"
assistenza = "ASSISTED"

# scelte lasciate a chi gareggia: da verificare sul regolamento dell'anno
[opzioni_categoria]
potenze = ["HIGH", "LOW", "QRP"]

[restrizioni]
avvio_umano = false
fox_hound = "vietato"
multi_flusso = "vietato"

[export]
formato = "cabrillo"
cabrillo_contest = "PACC"
cabrillo_modo = "DG"
colonne_inviate = ["rst", "seriale"]
colonne_ricevute = ["rst", "scambio"]
frequenza = "khz"
invio_url = "https://pacc.veron.nl/"
scadenza = "2026-04-26T23:59:59Z"
