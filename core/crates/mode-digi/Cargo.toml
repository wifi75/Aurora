[package]
name = "mode-digi"
description = "Modi digitali testuali di Aurora (PSK31/PSK63, RTTY): modulazione e demodulazione; tabelle riprese da fldigi di Dave Freese W1HKJ (GPL 3)"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
# Solo per le prove: compila i ricevitori RTTY, PSK e CW di fldigi (sottomodulo terze-parti/fldigi) come arbitri dei nostri. Mai nell'installatore.
fldigi-oracle = ["dep:cc"]
# Solo per le prove: compila il ricevitore RTTY di MMTTY 1.70L (sottomodulo terze-parti/mmtty, LGPL) come secondo arbitro. Mai nell'installatore.
mmtty-oracle = ["dep:cc"]

[build-dependencies]
cc = { version = "1.11.1", optional = true }

[dependencies]
aurora-core = { path = "../aurora-core" }
mode-sstv = { path = "../mode-sstv" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
