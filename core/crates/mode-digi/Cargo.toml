[package]
name = "mode-digi"
description = "Modi digitali testuali di Aurora (PSK31/PSK63, RTTY): modulazione e demodulazione; tabelle riprese da fldigi di Dave Freese W1HKJ (GPL 3)"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
# Solo per le prove: compila il ricevitore RTTY di fldigi (sottomodulo terze-parti/fldigi) come arbitro del nostro. Mai nell'installatore.
fldigi-oracle = ["dep:cc"]

[build-dependencies]
cc = { version = "1.11.1", optional = true }

[dependencies]
aurora-core = { path = "../aurora-core" }
mode-sstv = { path = "../mode-sstv" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
