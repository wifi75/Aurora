[package]
name = "rig-control"
description = "Comando della radio (frequenza e banda) condiviso con JTDX tramite Hamlib, OmniRig o TCI"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
aurora-core = { path = "../aurora-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tungstenite = { workspace = true }
sha2 = { workspace = true }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

# OmniRig via COM (IDispatch) e la ricerca della sua chiave nel registro
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[features]
# il finto rigctld per le prove di chi usa questo crate
testing = []
