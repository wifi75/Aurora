[package]
name = "engine-native"
description = "Motore proprio di Aurora in ricezione: porta l'audio a 12 kHz, lo divide nei periodi FT8 (15 s) o FT4 (7,5 s), lo decodifica con i crate ft8 e ft4 e lo confronta con JTDX"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
aurora-core = { path = "../aurora-core" }
audio-spectrum = { path = "../audio-spectrum" }
ft8 = { path = "../ft8" }
ft4 = { path = "../ft4" }
jt = { path = "../jt" }
rig-control = { path = "../rig-control" }
qso-native = { path = "../qso-native" }
tx-native = { path = "../tx-native" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
logbook = { path = "../logbook" }
qso-export = { path = "../qso-export" }
