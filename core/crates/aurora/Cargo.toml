[package]
name = "aurora"
description = "Binario di Aurora: collega motore, log, autenticazione e API"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "aurora"
path = "src/lib.rs"

[[bin]]
name = "aurora"
path = "src/main.rs"

[dependencies]
aurora-core = { path = "../aurora-core" }
engine-sim = { path = "../engine-sim" }
engine-jtdx = { path = "../engine-jtdx" }
clock-sync = { path = "../clock-sync" }
dx-cluster = { path = "../dx-cluster" }
wishlist = { path = "../wishlist" }
updater = { path = "../updater" }
input-level = { path = "../input-level" }
decode-history = { path = "../decode-history" }
dxcc = { path = "../dxcc" }
qso-engine = { path = "../qso-engine" }
qso-export = { path = "../qso-export" }
rig-control = { path = "../rig-control" }
audio-spectrum = { path = "../audio-spectrum" }
udp-hub = { path = "../udp-hub" }
auth = { path = "../auth" }
logbook = { path = "../logbook" }
remote-api = { path = "../remote-api" }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
udp-bridge = { path = "../udp-bridge" }
serde_json = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
