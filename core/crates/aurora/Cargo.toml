[package]
name = "aurora"
description = "Binario di Aurora: collega motore, log, autenticazione e API"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "aurora"
path = "src/lib.rs"

[[bin]]
name = "aurora"
path = "src/main.rs"

[dependencies]
aurora-core = { path = "../aurora-core" }
engine-sim = { path = "../engine-sim" }
engine-jtdx = { path = "../engine-jtdx" }
clock-sync = { path = "../clock-sync" }
dx-cluster = { path = "../dx-cluster" }
wishlist = { path = "../wishlist" }
updater = { path = "../updater" }
input-level = { path = "../input-level" }
decode-history = { path = "../decode-history" }
online-info = { path = "../online-info" }
dxcc = { path = "../dxcc" }
qso-engine = { path = "../qso-engine" }
qso-export = { path = "../qso-export" }
rig-control = { path = "../rig-control" }
audio-spectrum = { path = "../audio-spectrum" }
engine-native = { path = "../engine-native" }
tx-native = { path = "../tx-native" }
udp-bridge = { path = "../udp-bridge" }
udp-emitter = { path = "../udp-emitter" }
reporting = { path = "../reporting" }
qso-native = { path = "../qso-native" }
auth = { path = "../auth" }
logbook = { path = "../logbook" }
remote-api = { path = "../remote-api" }
qmap = { path = "../qmap" }
mode-sstv = { path = "../mode-sstv" }
mode-digi = { path = "../mode-digi" }
mode-sat = { path = "../mode-sat" }
contest = { path = "../contest" }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
sha2 = { workspace = true }
getrandom = { workspace = true }

# l'ora locale del PC per la fascia oraria dell'automazione
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Time"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
