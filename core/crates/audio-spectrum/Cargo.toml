[package]
name = "audio-spectrum"
description = "Spettro audio per la cascata di Aurora: analizzatore FFT e cattura dalla scheda audio"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
aurora-core = { path = "../aurora-core" }
tokio = { workspace = true }
tracing = { workspace = true }
cpal = "0.18.2"
rustfft = "6.4.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }
