[package]
name = "audio-spectrum"
description = "Spettro audio per la cascata di Aurora: analizzatore FFT e cattura dalla scheda audio"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
aurora-core = { path = "../aurora-core" }
tokio = { workspace = true }
tracing = { workspace = true }
# «realtime»: il thread audio a priorita' alta (MMCSS su Windows), meno blocchi persi quando il PC e' carico
# Linux: con "pulseaudio" cpal parla con PulseAudio/PipeWire (pipewire-pulse) quando c'e', come WSJT-X e JS8Call, e vede gli stessi
# dispositivi; senza server audio torna ad ALSA. Su Windows e macOS non cambia nulla (dipendenza solo per Linux e BSD).
cpal = { version = "0.18.2", features = ["realtime", "pulseaudio"] }
rustfft = "6.4.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }
