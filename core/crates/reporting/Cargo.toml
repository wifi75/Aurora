[package]
name = "reporting"
description = "Invii verso l'esterno della scheda Segnalazioni di JTDX: spotting su PSK Reporter e DXSummit, QSO al server TCP e a eQSL, con stato dell'ultimo invio"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
aurora-core = { path = "../aurora-core" }
logbook = { path = "../logbook" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
