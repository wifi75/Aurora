[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.9.0"
authors = ["Tiziano Cassone"]

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "io-util"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.1"
getrandom = "0.4.3"
hex = "0.4.3"
axum = { version = "0.8.9", features = ["ws"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
utoipa = "6.0.0"
